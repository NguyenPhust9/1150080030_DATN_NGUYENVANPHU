<article class="room-card"><a class="room-visual" href="{% url 'public-room-detail' room.id %}"><span class="availability">Còn trống</span></a><div class="room-body"><div class="room-location">{{ room.building.name }} · Tầng {{ room.floor }}</div><h3><a href="{% url 'public-room-detail' room.id %}">Phòng {{ room.number }}</a></h3><p>{{ room.building.address|truncatechars:65 }}</p><div class="room-meta"><span>{% if room.area %}{{ room.area }} m²{% else %}Đang cập nhật{% endif %}</span><span>{{ room.max_occupants }} người</span></div><div class="room-price"><strong>{{ room.monthly_rent|vnd }} đ</strong><span>/ tháng</span></div></div></article>
