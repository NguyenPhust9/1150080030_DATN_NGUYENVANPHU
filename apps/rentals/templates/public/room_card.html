<article class="room-card" data-room-id="{{ room.id }}">
  <div class="room-visual">
    <a class="room-photo-link" href="{% url 'public-room-detail' room.id %}" aria-label="Xem phòng {{ room.number }}">
      {% if room.cover_image_url %}<img class="room-cover" src="{{ room.cover_image_url }}" alt="Ảnh phòng {{ room.number }}" loading="lazy">{% elif home_card %}<span class="home-photo-placeholder"><i data-lucide="image"></i><span>Ảnh đang cập nhật</span></span>{% endif %}
    </a>
    <button type="button" class="favorite-icon" data-favorite-room="{{ room.id }}" aria-label="Thêm phòng {{ room.number }} vào yêu thích" title="Lưu phòng yêu thích"><i data-lucide="heart"></i></button>
  </div>
  <div class="room-body">
    <h3><a href="{% url 'public-room-detail' room.id %}">Phòng {{ room.number }}</a></h3>
    <div class="room-price"><strong>{{ room.monthly_rent|vnd }} đ/tháng</strong></div>
    <div class="room-meta"><span><i data-lucide="scan"></i> {% if room.area %}{{ room.area }}m²{% else %}--{% endif %}</span><span><i data-lucide="bed-double"></i> {{ room.max_occupants }} người</span></div>
    <span class="availability">Còn trống</span>
  </div>
</article>
