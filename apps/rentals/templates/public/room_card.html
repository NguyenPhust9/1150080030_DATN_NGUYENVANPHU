<article class="room-card"><a class="room-visual" href="{% url 'public-room-detail' room.id %}">{% if room.cover_image_url %}<img class="room-cover" src="{{ room.cover_image_url }}" alt="Ảnh phòng {{ room.number }}" loading="lazy">{% endif %}<span class="favorite-icon"><i data-lucide="heart"></i></span></a><div class="room-body"><h3><a href="{% url 'public-room-detail' room.id %}">Phòng {{ room.number }}</a></h3><div class="room-price"><strong>{{ room.monthly_rent|vnd }} đ/tháng</strong></div><div class="room-meta"><span><i data-lucide="scan"></i> {% if room.area %}{{ room.area }}m²{% else %}--{% endif %}</span><span><i data-lucide="bed-double"></i> {{ room.max_occupants }} người</span></div><span class="availability">Còn trống</span></div></article>
