services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ql_phong_cho_thue
      POSTGRES_USER: ql_user
      POSTGRES_PASSWORD: ql_password_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ql_user -d ql_phong_cho_thue"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: development-only-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: ql_phong_cho_thue
      POSTGRES_USER: ql_user
      POSTGRES_PASSWORD: ql_password_dev
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
